services:
  - type: web
    name: face-recognition-security-system
    env: docker
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 5000
      - key: TWILIO_ACCOUNT_SID
        sync: false  # Must be filled in Render Dashboard
      - key: TWILIO_AUTH_TOKEN
        sync: false  # Must be filled in Render Dashboard
      - key: TWILIO_FROM_NUMBER
        sync: false  # Must be filled in Render Dashboard
      - key: TO_NUMBER
        sync: false  # Must be filled in Render Dashboard
      - key: VIDEO_SOURCE
        value: "rtsp://your_cctv_ip_or_domain:port/h264" # CCTV RTSP stream URL
      - key: CAMERA_MODE
        value: "cctv" # CCTV mode runs 24/7
      - key: COOLDOWN_SECONDS
        value: "300"
      - key: CAPTURE_COOLDOWN_SECONDS
        value: "10"
      - key: TOLERANCE
        value: "0.6"
